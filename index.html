<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwfW8rfH8rNZURHw2-7MJE25TumQ_mnuepl54cXApnf64UsNRYSHwg6LrgLVmurzfoO/exec';

const USD_INR = 85, TTL = 6 * 3600e3, LS = 'shophai.chats.v1';
const SUGG = ['📱 smartphone', '👟 running shoes', '💻 laptop under 50000', '🎧 cheapest earbuds', '⌚ smartwatch', '🎒 backpack', '🕶 sunglasses', '🧴 perfume under 1000'];
const SORTS = { rel: 'Relevance', pa: 'Price: low to high', pd: 'Price: high to low', rt: 'Top rated', ds: 'Biggest discount' };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe = u => /^https?:\/\//i.test(u || '') ? u : '#';
const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
// ---------- storage ----------
let chats = (() => { try { return JSON.parse(localStorage.getItem(LS)) || []; } catch (_) { return []; } })();
let active = null, busy = false;
function save() {
  chats.sort((a, b) => b.ts - a.ts); chats = chats.slice(0, 30);
  try { localStorage.setItem(LS, JSON.stringify(chats)); }
  catch (_) { chats = chats.slice(0, 8); try { localStorage.setItem(LS, JSON.stringify(chats)); } catch (__) {} }
}

// ---------- prompt understanding ----------
function parsePrompt(text) {
  let q = ' ' + text.toLowerCase() + ' ', max = 0, min = 0, sort = 'rel';
  const val = (n, k) => Number(String(n).replace(/,/g, '')) * (k ? 1000 : 1);
  q = q.replace(/\b(under|below|less than|upto|up to|within|max)\s*(?:rs\.?|₹)?\s*(\d[\d,]*)\s*(k)?/g, (_, a, n, k) => { max = val(n, k); return ' '; });
  q = q.replace(/\b(above|over|more than|min)\s*(?:rs\.?|₹)?\s*(\d[\d,]*)\s*(k)?/g, (_, a, n, k) => { min = val(n, k); return ' '; });
  if (/\b(cheapest|lowest price|cheap)\b/.test(q)) { sort = 'pa'; q = q.replace(/\b(cheapest|lowest price|cheap)\b/g, ' '); }
  if (/\b(best|top rated|highest rated)\b/.test(q)) { sort = 'rt'; q = q.replace(/\b(best|top rated|highest rated)\b/g, ' '); }
  q = q.replace(/\b(i want to buy|i want|buy me|show me|find me|please|for me)\b/g, ' ').replace(/\s+/g, ' ').trim();
  return { q: q || text.trim().toLowerCase(), max, min, sort };
}

// ---------- data: local cache -> Apps Script -> demo fallback; never throws ----------
async function getItems(q) {
  const ck = 'shophai.q:' + q;
  try { const c = JSON.parse(localStorage.getItem(ck)); if (c && Date.now() - c.t < TTL && c.d.length) return c.d; } catch (_) {}
  let items = [];
  if (!API_URL.startsWith('PASTE')) {
    try { const r = await fetch(API_URL + '?q=' + encodeURIComponent(q)); items = (await r.json()).items || []; } catch (_) {}
  }
  if (!items.length) items = await demo(q);
  items = items.slice(0, 30);
  if (items.length) { try { localStorage.setItem(ck, JSON.stringify({ t: Date.now(), d: items })); } catch (_) {} }
  return items;
}
async function demo(q) {
  const words = q.split(/\s+/).filter(w => w.length > 2); let raw = [];
  for (const t of [q, ...words]) {
    if (raw.length >= 12) break;
    try { const r = await fetch('https://dummyjson.com/products/search?limit=20&q=' + encodeURIComponent(t)); raw = raw.concat((await r.json()).products || []); } catch (_) {}
  }
  const seen = new Set();
  return raw.filter(p => !seen.has(p.id) && seen.add(p.id)).map(p => {
    const price = Math.round(p.price * USD_INR), off = p.discountPercentage || 0;
    return { id: 'd' + p.id, title: p.title, price, mrp: off > 1 ? Math.round(price / (1 - off / 100)) : 0, img: p.thumbnail || '', store: 'Demo catalog', url: 'https://www.amazon.in/s?k=' + encodeURIComponent(p.title), rating: p.rating || 0, reviews: (p.reviews || []).length, demo: true };
  });
}
const storeLinks = q => { const e = encodeURIComponent(q), h = encodeURIComponent(q.trim().replace(/\s+/g, '-')); return [
  ['Amazon.in', 'https://www.amazon.in/s?k=' + e], ['Flipkart', 'https://www.flipkart.com/search?q=' + e], ['Meesho', 'https://www.meesho.com/search?q=' + e],
  ['Myntra', 'https://www.myntra.com/' + h], ['Ajio', 'https://www.ajio.com/search/?text=' + e], ['Croma', 'https://www.croma.com/searchB?q=' + e + '%3Arelevance&text=' + e],
  ['Snapdeal', 'https://www.snapdeal.com/search?keyword=' + e], ['Tata CLiQ', 'https://www.tatacliq.com/search/?searchCategory=all&text=' + e], ['Google Shopping', 'https://www.google.com/search?tbm=shop&gl=in&q=' + e]]; };
const linksHtml = q => `<div class="links">Also search “${esc(q)}” on: ${storeLinks(q).map(([n, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${n} ↗</a>`).join('')}</div>`;


// ---------- progress (uses real result counts, no fake store list) ----------
async function think(box, p, dataP) {
  const t0 = Date.now();
  const crit = `“${p.q}”` + (p.max ? ` under ${inr(p.max)}` : '') + (p.min ? ` above ${inr(p.min)}` : '') + (p.sort !== 'rel' ? `, sorted by ${SORTS[p.sort].toLowerCase()}` : '');
  const steps = [['Understanding your request', crit], ['Finding listings', 'Looking for matching products…'], ['Comparing price, rating and discount', 'Ranking what we found…']];
  box.innerHTML = `<ul>${steps.map(s => `<li><span class="ic"></span><div><b>${s[0]}</b><small>${esc(s[1])}</small></div></li>`).join('')}</ul>`;
  const lis = [...box.querySelectorAll('li')], sm = i => lis[i].querySelector('small');
  const run = async (i, work) => { lis[i].classList.add('act'); lis[i].querySelector('b').classList.add('shimmer'); await work; lis[i].classList.remove('act'); lis[i].classList.add('ok'); lis[i].querySelector('b').classList.remove('shimmer'); };
  await run(0, sleep(450));
  await run(1, Promise.all([dataP, sleep(600)]));
  const items = await dataP, n = items.length, st = new Set(items.map(i => i.store)).size, demo = n && items.every(i => i.demo);
  const found = !n ? 'No listings matched' : demo ? plural(n, 'sample product') : `${plural(n, 'listing')} from ${plural(st, 'store')}`;
  sm(1).textContent = found;
  await run(2, sleep(450));
  sm(2).textContent = n ? `Lowest ${inr(Math.min(...items.map(i => i.price)))}, highest ${inr(Math.max(...items.map(i => i.price)))}` : 'Nothing to rank';
  const secs = ((Date.now() - t0) / 1000).toFixed(1), det = [steps[0][1], found, sm(2).textContent];
  box.innerHTML = `<details class="done"><summary>${esc(found)} · ${secs}s</summary><ul>${steps.map((s, i) => `<li><b>${s[0]}</b>: ${esc(det[i])}</li>`).join('')}</ul></details>`;
}
// ---------- results ----------
function renderResults(host, msg) {
  const { items, p } = msg;
  if (!items.length) { host.innerHTML = `<div class="none">We couldn’t find “${esc(p.q)}”. Try a simpler name, or search the stores directly:</div>` + linksHtml(p.q); return; }
  const stores = [...new Set(items.map(i => i.store))].slice(0, 12), isDemo = items.every(i => i.demo);
  const pct = i => i.mrp > i.price ? 1 - i.price / i.mrp : 0;
  const low = items.reduce((a, b) => b.price < a.price ? b : a), top = items.reduce((a, b) => (b.rating || 0) > (a.rating || 0) ? b : a), deal = items.reduce((a, b) => pct(b) > pct(a) ? b : a);
  host.innerHTML = `<div class="sum"></div>
  <div class="tools"><select data-k="so">${Object.entries(SORTS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
   <input data-k="mn" type="number" min="0" placeholder="Min ₹"><input data-k="mx" type="number" min="0" placeholder="Max ₹">
   <select data-k="rt"><option value="0">Any rating</option><option value="3">3★ &amp; up</option><option value="4">4★ &amp; up</option></select>
   <label><input type="checkbox" data-k="dl"> Deals only</label><button type="button" class="rs" data-k="rs" hidden>Reset filters</button></div>
  <div class="stores">${isDemo ? '' : stores.map(s => `<button type="button" class="chip" data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div>
  <div class="grid"></div>${linksHtml(p.q)}`;
  const g = k => host.querySelector(`[data-k=${k}]`);
  g('so').value = p.sort; g('mn').value = p.min || ''; g('mx').value = p.max || '';
  const apply = () => {
    const dirty = !!(+g('mn').value || +g('mx').value || +g('rt').value || g('dl').checked || host.querySelector('.stores .chip.on'));
    g('rs').hidden = !dirty;
    const mn = +g('mn').value || 0, mx = +g('mx').value || 0, rt = +g('rt').value || 0, dl = g('dl').checked, so = g('so').value;
    const on = [...host.querySelectorAll('.stores .chip.on')].map(c => c.dataset.s);
    let a = items.filter(i => (!mn || i.price >= mn) && (!mx || i.price <= mx) && (!rt || i.rating >= rt) && (!dl || pct(i) >= .1) && (!on.length || on.includes(i.store)));
    const S = { pa: (x, y) => x.price - y.price, pd: (x, y) => y.price - x.price, rt: (x, y) => y.rating - x.rating || y.reviews - x.reviews, ds: (x, y) => pct(y) - pct(x) };
    if (S[so]) a = a.slice().sort(S[so]);
    const avg = a.length ? a.reduce((s, i) => s + i.price, 0) / a.length : 0;
    host.querySelector('.sum').innerHTML = a.length ? `<div class="stat g"><small>Lowest</small><b>${inr(Math.min(...a.map(i => i.price)))}</b></div><div class="stat"><small>Average</small><b>${inr(avg)}</b></div><div class="stat"><small>Highest</small><b>${inr(Math.max(...a.map(i => i.price)))}</b></div><div class="stat"><small>Showing</small><b>${a.length}/${items.length}</b></div>` + (items.every(i => i.demo) ? '<div class="stat"><small>Source</small><b style="font-size:14px">Sample catalog</b></div>' : `<div class="stat"><small>Stores</small><b>${stores.length}</b></div>`) : '';
    host.querySelector('.grid').innerHTML = a.length ? a.map((i, n) => {
      const d = Math.round(pct(i) * 100);
      const badge = i === low ? '<span class="bd">Lowest price</span>' : i === top && i.rating ? '<span class="bd a">Top rated</span>' : i === deal && d >= 10 ? '<span class="bd p">Best deal</span>' : d ? `<span class="bd">${d}% OFF</span>` : '';
      return `<article class="card" style="animation-delay:${Math.min(n, 12) * 40}ms"><div class="img${i.img ? '' : ' ph'}">${i.img ? `<img loading="lazy" referrerpolicy="no-referrer" src="${esc(safe(i.img))}" alt="" onerror="this.parentNode.classList.add('ph');this.remove()">` : ''}${badge}${i.demo ? '<span class="dm">DEMO</span>' : ''}</div>
      <div class="cb"><div class="t">${esc(i.title)}</div><div class="pr">${inr(i.price)}${d ? `<s>${inr(i.mrp)}</s>` : ''}</div>
      <div class="mt"><span>${esc(i.store)}</span><span>${i.rating ? '★ ' + Number(i.rating).toFixed(1) : ''}</span></div>
      <a class="go" href="${esc(safe(i.url))}" target="_blank" rel="noopener noreferrer">View deal</a></div></article>`; }).join('')
      : '<div class="none">Nothing matches these filters. Try loosening them or use Reset filters.</div>';
  };
  host.querySelector('.tools').addEventListener('input', apply);
  g('rs').onclick = () => { g('mn').value = g('mx').value = ''; g('rt').value = '0'; g('dl').checked = false; host.querySelectorAll('.stores .chip.on').forEach(c => c.classList.remove('on')); apply(); };

async function runTurn(sec, chat, text, idx, fresh) {
  if (Auth.gate()) return;
  busy = true; $('#go').disabled = true;
  try {
    const p = parsePrompt(text);
    if (fresh) { try { localStorage.removeItem('shophai.q:' + p.q); } catch (_) {} }
    sec.querySelector('.user span').textContent = text;
    const body = sec.querySelector('.ansbody'); let th = body.querySelector('.think');
    if (!th) { th = document.createElement('div'); th.className = 'think'; body.prepend(th); }
    th.innerHTML = ''; body.querySelector('.res').innerHTML = '';
    const dataP = getItems(p.q); toEnd();
    await think(th, p, dataP);
    const items = await dataP, msg = { text, p, items, ts: Date.now() };
    chat.msgs[idx] = msg; if (idx === 0) chat.title = text.slice(0, 50);
    chat.ts = Date.now(); save(); renderHist();
    renderResults(body.querySelector('.res'), msg); toEnd(); Auth.after();
  } finally { busy = false; $('#go').disabled = false; }
}
async function search(text) {
  text = text.trim(); if (!text || busy) return; if (Auth.gate()) { $('#q').value = text; return; } closeSide();

  const idx = chat.msgs.length, sec = turnShell(text, idx);

}
// prompt actions: copy, edit, retry
const copyText = async t => { try { await navigator.clipboard.writeText(t); } catch (_) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); } catch (__) {} a.remove(); } };

(() => {

  if (!SR) return; mic.hidden = false;

  const note = m => { q.placeholder = m; setTimeout(() => q.placeholder = ph, 3500); };
  const stop = () => { if (rec) rec.stop(); };

    if (rec) return stop();

    rec = new SR(); rec.lang = 'en-IN'; rec.interimResults = true; rec.maxAlternatives = 1; heard = '';

    rec.onresult = e => { heard = [...e.results].map(r => r[0].transcript).join(' ').trim(); q.value = heard.slice(0, 100); };

    <div class="pn"><h3>Searches per day, last 14 days</h3><div class="days">${s.days.map(x => `<div style="height:${x.n / mx * 100}%" title="${x.d}: ${x.n}"></div>`).join('')}</div></div>
    <div class="two"><div class="pn"><h3>Top searches</h3>${bars(s.top, 'q', 'n')}</div><div class="pn"><h3>Where results came from</h3>${bars(s.sources, 's', 'n')}<h3 style="margin-top:16px">Searches with no results</h3>${bars(s.zero, 'q', 'n')}</div></div>
    <div class="pn"><h3>Recent searches</h3><div class="tw"><table class="tb">${s.recent.map(r => `<tr><td>${when(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${r[3]} found</td></tr>`).join('') || '<tr><td>No searches logged yet.</td></tr>'}</table></div></div>
    <div class="emp2">Based on the latest ${s.sampled} logged searches.</div></div>`;
    $('#dRef').onclick = load; $('#dClose').onclick = () => d.hidden = true; $('#dOut').onclick = signOut;
  };
  async function load() {
    d.hidden = false; if (!d.innerHTML) d.innerHTML = '<div class="dh"><h2>Loading…</h2></div>';
    try { const r = await post({ action: 'stats', token: tok() }); if (r.ok) return draw(r.stats); if (r.error === 'auth') { signOut(); openM('login', 'Session expired. Log in again.'); return; } throw 0; }
    catch (_) { d.innerHTML = '<div class="dh"><h2>Couldn’t load the dashboard</h2><button class="btn" id="dRef">Try again</button><button class="btn pri" id="dClose">Close</button></div>'; $('#dRef').onclick = load; $('#dClose').onclick = () => d.hidden = true; }
  }
  $('#owner').onclick = () => openM(tok() ? 'account' : 'login');
  $('#ownCancel').onclick = () => m.hidden = true;
  $('#amDash').onclick = () => { m.hidden = true; d.innerHTML = ''; load(); };
  m.addEventListener('mousedown', e => { if (e.target === m) m.hidden = true; });
  addEventListener('keydown', e => { if (e.key === 'Escape') { m.hidden = true; d.hidden = true; } });
  document.addEventListener('click', e => { const b = e.target.closest('[data-auth]'); if (b) openM(b.dataset.auth); const w = e.target.closest('[data-sw]'); if (w) view(w.dataset.sw); });
  $('#ownForm').addEventListener('submit', async e => {
    e.preventDefault();
    if (mode === 'account') return signOut();
    if (!live) { err.textContent = 'Add your Apps Script URL to API_URL first.'; return; }
    if (!em.value || !pw.value) { err.textContent = 'Enter your email and password.'; return; }
    const t0 = go.textContent; go.disabled = true; go.textContent = 'Please wait…'; err.textContent = '';
    try {
      const r = await post({ action: mode, email: em.value, pass: pw.value });
      if (r.ok) { setSession(r.token, r.email, r.role); m.hidden = true; if (r.role === 'owner') { d.innerHTML = ''; load(); } }
      else err.textContent = MSG[r.error] || 'Something went wrong. Try again.';
    } catch (_) { err.textContent = 'Couldn’t reach the server. Check your connection.'; }
    go.disabled = false; go.textContent = t0; pw.value = '';
  });
  sync();
  if (live && tok()) post({ action: 'me', token: tok() }).then(r => { if (!r.ok && r.error === 'auth') setSession('', '', ''); }).catch(() => {});
  return {
    gate() { if (!blocked()) return false; showGate(); openM('login', 'Log in or create an account to continue'); return true; },
    after() { if (live && !tok()) { ls.set('shophai.guest', String(used() + 1)); sync(); showGate(); } }
  };
})();
// ---------- init ----------
try { document.documentElement.dataset.theme = localStorage.getItem('shophai.theme') || 'light'; } catch (_) { document.documentElement.dataset.theme = 'light'; }
paintTheme();
$('#chips').innerHTML = SUGG.map(s => `<button class="chip" data-q="${esc(s.replace(/^\S+\s/, ''))}">${esc(s)}</button>`).join('');
if (API_URL.startsWith('PASTE')) $('#demoNote').innerHTML = '<span class="demo-note">Showing sample products. Add your Apps Script URL to see live prices.</span>';
$('#hero').onclick = e => { const b = e.target.closest('[data-q]'); if (b) search(b.dataset.q); };
save(); renderHist();
</script></body></html>
